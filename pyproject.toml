[project]
name = "teams-auto-join"
version = "0.1.0"
description = "Join a Microsoft Teams meeting (muted, camera off) at a scheduled or randomized time and screenshot it every 20 minutes for 2 hours."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.47",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # IANA timezone database (needed on Windows)
]

[project.scripts]
teams-join = "teams_auto_join.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_auto_join"]
